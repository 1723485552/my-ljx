<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>九宫切图与拼长图 · 预览</title>
<style>
  :root {
    --primary: #6750a4;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --bg: #f4f1f8;
    --outline: #cac4d0;
    --on-surface: #1c1b1f;
    --on-surface-variant: #49454f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--on-surface);
  }
  header {
    background: var(--primary);
    color: var(--on-primary);
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .tabs { display: flex; gap: 4px; background: var(--surface); padding: 0 12px; border-bottom: 1px solid var(--outline); }
  .tab { padding: 12px 16px; cursor: pointer; color: var(--on-surface-variant); border-bottom: 3px solid transparent; font-weight: 600; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .panel { padding: 16px; display: none; }
  .panel.active { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--outline); background: var(--surface); cursor: pointer; font-size: 13px; }
  .chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .card { background: var(--surface); border: 1px solid var(--outline); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-tonal { background: #e8def8; color: var(--primary); }
  .btn-outline { background: transparent; border: 1px solid var(--outline); color: var(--on-surface); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .empty { text-align: center; padding: 48px 16px; color: var(--on-surface-variant); }
  .empty .icon { font-size: 56px; opacity: .35; }
  .grid { display: grid; gap: 6px; margin-top: 8px; }
  .grid .cell { position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; aspect-ratio: 1/1; background: rgba(0,0,0,.05); }
  .grid .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .grid .cell .num { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg { display: flex; border: 1px solid var(--outline); border-radius: 999px; overflow: hidden; }
  .seg button { border: none; background: var(--surface); padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .seg button.active { background: var(--primary); color: var(--on-primary); }
  .queue { list-style: none; padding: 0; margin: 8px 0 0; }
  .queue li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .queue img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
  .queue .close { margin-left: auto; cursor: pointer; border: none; background: transparent; font-size: 18px; color: var(--on-surface-variant); }
  .preview-img { width: 100%; border-radius: 8px; margin-top: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 16px; z-index: 10; }
  .modal.show { display: flex; }
  .modal img { max-width: 92vw; max-height: 78vh; object-fit: contain; }
  .modal .bar { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .modal .badge { color: #fff; background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 999px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--on-surface-variant); }
  .spacer { flex: 1; }
</style>
</head>
<body>
<header>九宫切图与拼长图 · 内置浏览器预览</header>

<div class="tabs">
  <div class="tab active" data-tab="grid">多格切图</div>
  <div class="tab" data-tab="stitch">长图无缝拼接</div>
</div>

<!-- 切图面板 -->
<div class="panel active" id="panel-grid">
  <div class="chips" id="squareChips"></div>
  <div class="chips" id="presetChips"></div>
  <div class="card" id="gridEmpty">
    <div class="empty">
      <div class="icon">▦</div>
      <div style="font-weight:600;margin-top:8px">载入一张图片进行多宫格切分</div>
      <div class="hint" style="margin-top:6px">纯内存切图，不向相册写入碎图垃圾</div>
      <div style="margin-top:20px"><button class="btn btn-tonal" id="pickGrid">选择图片</button></div>
    </div>
  </div>
  <div class="card" id="gridResult" style="display:none">
    <div class="row">
      <strong style="color:var(--primary);font-size:13px">发帖预览（完整无裁切）</strong>
      <div class="spacer"></div>
      <button class="btn btn-outline" id="changeGrid">更换图片</button>
    </div>
    <div class="grid" id="slicedGrid"></div>
  </div>
</div>

<!-- 拼接面板 -->
<div class="panel" id="panel-stitch">
  <div class="row">
    <button class="btn btn-tonal" id="pickStitch">添加图片</button>
    <button class="btn btn-outline" id="clearStitch" style="display:none">清空列表</button>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="doStitch" disabled>开始拼接</button>
  </div>
  <div class="row" id="spacingRow" style="display:none">
    <span style="font-size:13px;font-weight:500">拼接间距:</span>
    <div class="seg" id="spacingSeg">
      <button data-v="0" class="active">0px 无缝</button>
      <button data-v="4">4px</button>
      <button data-v="8">8px</button>
      <button data-v="16">16px</button>
    </div>
  </div>
  <div class="card" id="stitchQueue" style="display:none">
    <strong style="font-size:12px">待拼接序列（已选 <span id="qCount">0</span> 张）:</strong>
    <ul class="queue" id="queueList"></ul>
  </div>
  <div class="card" id="stitchResult" style="display:none">
    <div class="row">
      <strong style="color:var(--primary);font-size:13px">拼接长图预览</strong>
      <div class="spacer"></div>
      <span class="hint" id="resultSize"></span>
    </div>
    <img class="preview-img" id="stitchedImg" alt="拼接结果" />
  </div>
</div>

<div class="modal" id="modal">
  <div class="bar">
    <span class="badge" id="modalBadge">第 1 格</span>
    <button class="btn btn-tonal" id="copyCell">复制此格</button>
    <button class="btn btn-outline" id="closeModal">关闭</button>
  </div>
  <img id="modalImg" alt="大图" />
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
<div class="toast" id="toast"></div>

<script>
const PRESETS = [
  { key: 'grid3x3', label: '九宫格 (3×3)', rows: 3, cols: 3 },
  { key: 'grid2x2', label: '四宫格 (2×2)', rows: 2, cols: 2 },
  { key: 'grid3x1', label: '横向三联 (3×1)', rows: 1, cols: 3 },
  { key: 'grid1x3', label: '纵向三联 (1×3)', rows: 3, cols: 1 },
];
const SQUARE_MODES = [
  { key: 'padWhite', label: '等比留白 (推荐)' },
  { key: 'centerCrop', label: '居中裁剪 (1:1)' },
  { key: 'original', label: '原比例直切' },
];
let selectedPreset = PRESETS[0];
let selectedSquareMode = 'padWhite';
let sourceImg = null;          // 当前切图原图 (Image)
let stitchImgs = [];           // 拼接队列 (Image 列表)
let stitchSpacing = 0;
let modalDataUrl = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}
function dataUrlToBytes(dataUrl) {
  // 仅用于展示体积估算
  const b64 = dataUrl.split(',')[1] || '';
  return Math.floor(b64.length * 0.75);
}

// ---------- Tab 切换 ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  };
});

// ---------- 画幅适配模式 chips ----------
const squareBox = document.getElementById('squareChips');
SQUARE_MODES.forEach(m => {
  const c = document.createElement('div');
  c.className = 'chip' + (m.key === selectedSquareMode ? ' active' : '');
  c.textContent = m.label;
  c.onclick = () => {
    selectedSquareMode = m.key;
    document.querySelectorAll('#squareChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    if (sourceImg) sliceImage();
  };
  squareBox.appendChild(c);
});

// ---------- 切图预设 chips ----------
const chipsBox = document.getElementById('presetChips');
PRESETS.forEach(p => {
  const c = document.createElement('div');
  c.className = 'chip' + (p === selectedPreset ? ' active' : '');
  c.textContent = p.label;
  c.onclick = () => {
    selectedPreset = p;
    document.querySelectorAll('#presetChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    if (sourceImg) sliceImage();
  };
  chipsBox.appendChild(c);
});

// ---------- 切图 ----------
async function pickGrid() {
  const input = document.getElementById('fileInput');
  input.multiple = false;
  input.onchange = async () => {
    if (!input.files.length) return;
    try { sourceImg = await loadImage(input.files[0]); sliceImage(); }
    catch (e) { toast('图片加载失败: ' + e); }
    input.value = '';
  };
  input.click();
}
document.getElementById('pickGrid').onclick = pickGrid;
document.getElementById('changeGrid').onclick = pickGrid;

function buildWorkingCanvas() {
  const w = sourceImg.width, h = sourceImg.height;
  if (selectedSquareMode === 'padWhite') {
    const side = Math.max(w, h);
    const cv = document.createElement('canvas');
    cv.width = side; cv.height = side;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, side, side);
    ctx.drawImage(sourceImg, (side - w) / 2, (side - h) / 2);
    return cv;
  } else if (selectedSquareMode === 'centerCrop') {
    const side = Math.min(w, h);
    const sx = (w - side) / 2, sy = (h - side) / 2;
    const cv = document.createElement('canvas');
    cv.width = side; cv.height = side;
    cv.getContext('2d').drawImage(sourceImg, sx, sy, side, side, 0, 0, side, side);
    return cv;
  }
  // original：原比例直切
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(sourceImg, 0, 0);
  return cv;
}

function sliceImage() {
  if (!sourceImg) return;
  const working = buildWorkingCanvas();
  const { rows, cols } = selectedPreset;
  const cw = working.width / cols;
  const ch = working.height / rows;
  const grid = document.getElementById('slicedGrid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  let idx = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(cw));
      cv.height = Math.max(1, Math.round(ch));
      cv.getContext('2d').drawImage(working, c * cw, r * ch, cw, ch, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/png');
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<img src="${url}"><div class="num">${idx + 1}</div>`;
      cell.onclick = () => openModal(url, idx + 1);
      grid.appendChild(cell);
      idx++;
    }
  }
  document.getElementById('gridEmpty').style.display = 'none';
  document.getElementById('gridResult').style.display = 'block';
  toast(`切图完成（${idx} 张）`);
}

// ---------- 单格放大 / 复制 ----------
const modal = document.getElementById('modal');
function openModal(url, num) {
  modalDataUrl = url;
  document.getElementById('modalImg').src = url;
  document.getElementById('modalBadge').textContent = '第 ' + num + ' 格';
  modal.classList.add('show');
}
document.getElementById('closeModal').onclick = () => modal.classList.remove('show');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };
document.getElementById('copyCell').onclick = async () => {
  try {
    const blob = await (await fetch(modalDataUrl)).blob();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('已复制图片到剪贴板');
    modal.classList.remove('show');
  } catch (e) {
    toast('复制失败（浏览器限制）: ' + e);
  }
};

// ---------- 拼接 ----------
const pickStitchBtn = document.getElementById('pickStitch');
pickStitchBtn.onclick = async () => {
  const input = document.getElementById('fileInput');
  input.multiple = true;
  input.onchange = async () => {
    for (const f of input.files) {
      try { stitchImgs.push(await loadImage(f)); } catch (e) { toast('加载失败: ' + e); }
    }
    input.value = '';
    renderQueue();
  };
  input.click();
};
document.getElementById('clearStitch').onclick = () => {
  stitchImgs = [];
  document.getElementById('stitchResult').style.display = 'none';
  renderQueue();
};
document.getElementById('doStitch').onclick = stitchImages;

document.querySelectorAll('#spacingSeg button').forEach(b => {
  b.onclick = () => {
    stitchSpacing = parseInt(b.dataset.v, 10);
    document.querySelectorAll('#spacingSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (document.getElementById('stitchResult').style.display === 'block') stitchImages();
  };
});

function renderQueue() {
  const n = stitchImgs.length;
  document.getElementById('qCount').textContent = n;
  document.getElementById('spacingRow').style.display = n ? 'flex' : 'none';
  document.getElementById('clearStitch').style.display = n ? 'inline-flex' : 'none';
  document.getElementById('stitchQueue').style.display = n ? 'block' : 'none';
  document.getElementById('doStitch').disabled = n < 2;
  const ul = document.getElementById('queueList');
  ul.innerHTML = '';
  stitchImgs.forEach((img, i) => {
    const li = document.createElement('li');
    const cv = document.createElement('canvas');
    cv.width = 44; cv.height = 44;
    cv.getContext('2d').drawImage(img, 0, 0, 44, 44);
    li.innerHTML = `<img src="${cv.toDataURL()}"><span style="font-size:13px">图片 #${i + 1}</span>`;
    const x = document.createElement('button');
    x.className = 'close'; x.textContent = '×';
    x.onclick = () => { stitchImgs.splice(i, 1); renderQueue(); };
    li.appendChild(x);
    ul.appendChild(li);
  });
}

function stitchImages() {
  if (stitchImgs.length < 2) { toast('请至少添加 2 张图片'); return; }
  let maxW = 0;
  stitchImgs.forEach(img => { if (img.width > maxW) maxW = img.width; });
  if (maxW === 0) maxW = 1080;
  const heights = stitchImgs.map(img => img.height * (maxW / img.width));
  let totalH = heights.reduce((a, b) => a + b, 0) + stitchSpacing * (stitchImgs.length - 1);
  const cv = document.createElement('canvas');
  cv.width = maxW; cv.height = Math.round(totalH);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, maxW, totalH);
  let y = 0;
  stitchImgs.forEach((img, i) => {
    const h = heights[i];
    ctx.drawImage(img, 0, y, maxW, h);
    y += h + stitchSpacing;
  });
  const url = cv.toDataURL('image/png');
  document.getElementById('stitchedImg').src = url;
  const kb = (dataUrlToBytes(url) / 1024).toFixed(1);
  document.getElementById('resultSize').textContent = kb + ' KB';
  document.getElementById('stitchResult').style.display = 'block';
  toast('长图拼接完成！');
}
</script>
</body>
</html>
