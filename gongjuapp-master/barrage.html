<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>手持全屏弹幕 · 预览</title>
<style>
  :root { --primary:#6750a4; --surface:#fff; --bg:#f4f1f8; --outline:#cac4d0; --on-surface-variant:#49454f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1c1b1f; }
  header { background:var(--primary); color:#fff; padding:14px 20px; font-size:18px; font-weight:600; }
  .panel { padding:16px; }
  .label { font-size:12px; font-weight:600; color:var(--on-surface-variant); margin-bottom:8px; }
  .chips { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .chip { padding:8px 14px; border-radius:999px; border:1px solid var(--outline); background:var(--surface); cursor:pointer; font-size:13px; white-space:nowrap; }
  .card { background:var(--surface); border:1px solid var(--outline); border-radius:16px; padding:16px; margin-bottom:16px; }
  textarea { width:100%; min-height:64px; font-size:16px; font-weight:700; border:1px solid var(--outline); border-radius:10px; padding:12px; resize:vertical; font-family:inherit; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; }
  .swatch { width:36px; height:36px; border-radius:50%; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center; color:#000; font-weight:700; font-size:14px; }
  .swatch.active { border-color:var(--primary); box-shadow:0 0 8px rgba(103,80,164,.5); }
  .row { display:flex; align-items:center; gap:12px; margin:10px 0; }
  .switch { position:relative; width:44px; height:24px; background:#ccc; border-radius:999px; cursor:pointer; transition:.2s; flex-shrink:0; }
  .switch.on { background:var(--primary); }
  .switch::after { content:''; position:absolute; width:20px; height:20px; background:#fff; border-radius:50%; top:2px; left:2px; transition:.2s; }
  .switch.on::after { left:22px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px; border:none; border-radius:14px; background:var(--primary); color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; z-index:20; pointer-events:none; }
  .toast.show { opacity:1; }
  select, input[type=range] { font-family:inherit; }
  select { padding:6px 10px; border-radius:8px; border:1px solid var(--outline); }
  /* 全屏播放层 */
  #player { position:fixed; inset:0; display:none; z-index:50; cursor:pointer; overflow:hidden; }
  #player.show { display:block; }
  #barrage { position:absolute; white-space:nowrap; font-weight:900; letter-spacing:2px; will-change:transform; }
  #hint { position:absolute; top:16px; right:24px; background:rgba(0,0,0,.6); color:#fff; padding:6px 12px; border-radius:20px; font-size:11px; display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<header>手持全屏弹幕</header>
<div class="panel">
  <div class="label">快捷场景模板:</div>
  <div class="chips" id="presets"></div>

  <div class="card">
    <div class="label">弹幕内容:</div>
    <textarea id="text">接机 / 应援 / 找人</textarea>
  </div>

  <div class="card">
    <div class="label">文字色彩 (高亮霓虹):</div>
    <div class="swatches" id="swatches"></div>
    <hr style="border:none;border-top:1px solid var(--outline);margin:16px 0" />
    <div class="row"><div class="switch" id="swGlow"></div><div><div style="font-size:14px;font-weight:500">霓虹光晕发光</div><div style="font-size:11px;color:var(--on-surface-variant)">增强暗光与夜间远距离可见度</div></div></div>
    <div class="row"><div class="switch" id="swBlink"></div><div><div style="font-size:14px;font-weight:500">爆闪模式 (Strobe)</div><div style="font-size:11px;color:var(--on-surface-variant)">以固定频率快速闪烁，极速吸引注意力</div></div></div>
  </div>

  <div class="card">
    <div class="row"><div class="label" style="margin:0">滚动方向:</div><div style="flex:1"></div>
      <select id="dir">
        <option value="rightToLeft">从右向左 (常规)</option>
        <option value="leftToRight">从左向右</option>
        <option value="staticCenter">静止居中</option>
      </select>
    </div>
    <div id="speedRow">
      <div class="row"><div class="label" style="margin:0">滚动速度:</div><div style="flex:1"></div><span id="speedVal" style="font-size:12px;color:var(--primary);font-weight:700"></span></div>
      <input type="range" id="speed" min="0.2" max="3" step="0.2" value="1" style="width:100%" />
    </div>
    <div class="row"><div class="label" style="margin:0">字号基准:</div><div style="flex:1"></div><span id="sizeVal" style="font-size:12px;color:var(--primary);font-weight:700"></span></div>
    <input type="range" id="size" min="40" max="150" step="2" value="72" style="width:100%" />
  </div>

  <button class="btn" id="launch">⛶ 进入全屏弹幕 (自动横屏)</button>
</div>

<div id="player">
  <div id="hint">👆 轻触屏幕任意位置退出全屏</div>
  <div id="barrage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRESETS = [
  { name:'🌟 机场接人', text:'张总 接机', color:'#FFEB3B', bg:'#000000', glow:false, speed:0 },
  { name:'💖 演唱会应援', text:'✨ 永远为你心动 ✨', color:'#FF4081', bg:'#120024', glow:true, speed:1.2 },
  { name:'🔥 爆闪招牌', text:'📢 全场特惠 5 折起！', color:'#00E676', bg:'#000000', glow:true, speed:1.5 },
  { name:'🚕 呼叫代驾/停车', text:'师傅 尾号 8888 在这里！', color:'#00E5FF', bg:'#0A0A0A', glow:true, speed:0.8 },
];
const COLORS = ['#FFEB3B','#FF1744','#FF4081','#00E676','#00E5FF','#D500F9','#FFFFFF','#FF9100'];

let state = { text:'接机 / 应援 / 找人', color:'#FFEB3B', bg:'#000000', glow:true, blink:false, dir:'rightToLeft', speed:1, size:72 };

const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1200); }

// 模板
const presetBox = $('presets');
PRESETS.forEach(p=>{
  const c=document.createElement('div'); c.className='chip'; c.textContent=p.name;
  c.onclick=()=>{ state.text=p.text; state.color=p.color; state.bg=p.bg; state.glow=p.glow; state.speed=p.speed; state.dir=p.speed===0?'staticCenter':'rightToLeft'; syncUI(); toast('已应用：'+p.name); };
  presetBox.appendChild(c);
});
// 调色
const swBox=$('swatches');
COLORS.forEach(c=>{
  const s=document.createElement('div'); s.className='swatch'; s.style.background=c; s.textContent='';
  s.onclick=()=>{ state.color=c; syncUI(); };
  swBox.appendChild(s);
});
// 开关
$('swGlow').onclick=()=>{ state.glow=!state.glow; syncUI(); };
$('swBlink').onclick=()=>{ state.blink=!state.blink; syncUI(); };
// 输入
$('text').oninput=e=>state.text=e.target.value;
$('dir').onchange=e=>{ state.dir=e.target.value; $('speedRow').style.display=state.dir==='staticCenter'?'none':'block'; };
$('speed').oninput=e=>{ state.speed=parseFloat(e.target.value); $('speedVal').textContent=state.speed.toFixed(1)+'x'; };
$('size').oninput=e=>{ state.size=parseInt(e.target.value); $('sizeVal').textContent=state.size+' px'; };

function syncUI(){
  $('text').value=state.text;
  document.querySelectorAll('.swatch').forEach((s,i)=>s.classList.toggle('active', COLORS[i]===state.color));
  $('swGlow').classList.toggle('on',state.glow);
  $('swBlink').classList.toggle('on',state.blink);
  $('dir').value=state.dir;
  $('speedRow').style.display=state.dir==='staticCenter'?'none':'block';
  $('speed').value=state.speed; $('speedVal').textContent=state.speed.toFixed(1)+'x';
  $('size').value=state.size; $('sizeVal').textContent=state.size+' px';
}
syncUI();

// 全屏播放
let raf=null, startT=0, blinkStart=0;
function launch(){
  if(!state.text.trim()){ toast('请输入弹幕文本内容'); return; }
  const player=$('player'), bar=$('barrage');
  player.style.background=state.bg;
  Object.assign(bar.style,{
    color:state.color, fontSize:state.size+'px',
    textShadow: state.glow ? `0 0 20px ${state.color}cc, 0 0 40px ${state.color}99` : 'none',
  });
  bar.textContent=state.text;
  player.classList.add('show');
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  startT=performance.now(); blinkStart=startT;
  cancelAnimationFrame(raf); loop();
  setTimeout(()=>{ $('hint').style.display='none'; }, 3000);
}
function loop(){
  const now=performance.now();
  const bar=$('barrage');
  // 爆闪
  if(state.blink){ const t=(now-blinkStart)%600; bar.style.opacity = t<300 ? '1' : '0.05'; }
  else bar.style.opacity='1';
  // 滚动
  if(state.dir!=='staticCenter'){
    const w=window.innerWidth, tw=bar.offsetWidth;
    const total=w+tw;
    const dur=6000/Math.max(0.2,state.speed);
    const prog=((now-startT)%dur)/dur;
    let x;
    if(state.dir==='rightToLeft') x=w-prog*total; else x=-tw+prog*total;
    const y=(window.innerHeight-bar.offsetHeight)/2;
    bar.style.transform=`translate(${x}px, ${y}px)`;
  } else {
    bar.style.left='50%'; bar.style.top='50%'; bar.style.transform='translate(-50%,-50%)';
  }
  raf=requestAnimationFrame(loop);
}
$('launch').onclick=launch;
$('player').onclick=()=>{ cancelAnimationFrame(raf); $('player').classList.remove('show'); $('hint').style.display='flex'; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); };
</script>
</body>
</html>
